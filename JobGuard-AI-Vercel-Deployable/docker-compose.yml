services:
  backend:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "pip install --no-cache-dir -r backend/requirements.txt && uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://localhost:8000}"
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      APP_BASE_URL: "${APP_BASE_URL:-http://localhost:8000}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_USE_SSL: "${SMTP_USE_SSL:-false}"
